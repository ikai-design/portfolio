<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f0f0f' : '#ffffff');
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Eugene Voroniuk, Senior Product Designer. End-to-end product design for complex SaaS, from research and systems to signup, activation, and revenue. Ex-Miro, ex-Wix."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Canonical is set per route in `SeoHead` (SPA); default matches homepage until JS runs. -->
    <link rel="canonical" href="https://eugenevoroniuk.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eugene Voroniuk" />
